<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập – Toukutei Gino 2</title>
    <link rel="icon" href="icon-192.png" /> 
    <style>
        body { margin: 0; background: #f8fafc; font-family: sans-serif; }
        .wrapper { max-width: 420px; margin: 20px auto; padding: 10px; }
        .warning-box { background: #fff3f3; border: 2px solid #ff4d4d; border-radius: 12px; padding: 15px; margin-bottom: 16px; text-align: center; }
        .warning-box h1 { color: #d90000; font-size: 18px; margin-bottom: 8px; }
        .warning-box p { font-size: 14px; line-height: 1.5; }
        .login-box { background: #fff; padding: 22px; border-radius: 12px; box-shadow: 0 10px 30px rgba(2,6,23,.12); text-align: center; }
        .login-box img { width: 80px; border-radius: 12px; margin-bottom: 10px; }
        .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; outline: none; }
        .login-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        
        #loginBtn { background: #1e40af; color: #fff; margin-top: 8px; }
        #registerBtn { background: #fff; color: #1e40af; border: 1px solid #1e40af; margin-top: 10px; }
        #registerBtn:hover { background: #eff6ff; }
        
        .note { margin-top: 8px; font-size: 12px; color: #6b7280; }
        #message { margin-top:12px; font-size:14px; min-height:18px; line-height: 1.4; font-weight: bold; }
    </style>
</head>

<body>
<div class="wrapper">
  <div class="warning-box">
    <h1>⚠️ CẢNH BÁO LỪA ĐẢO</h1>
    <p>Học viên lưu ý chỉ giao dịch với TikTok chính chủ.</p>
  </div>

    <div class="login-box">
        <img src="icon-192.png" alt="Logo" />
        <h2 style="margin:6px 0 12px;font-size:18px; color: #333;">🔒 Quiz App Toukutei 2</h2>
        
        <form id="loginForm">
            <input type="text" id="name" placeholder="Họ và tên (chỉ dùng khi đăng ký)" />
            <input type="email" id="email" placeholder="Email" required />
            <input type="password" id="password" placeholder="Mật khẩu" required />

            <button type="submit" id="loginBtn">Đăng nhập</button>
            <button type="button" id="registerBtn">Đăng ký tài khoản mới</button>
        </form>

        <p id="message"></p>

        <div style="margin-top:15px;font-size:12px;color:#6b7280; border-top: 1px solid #eee; padding-top: 10px;">
            Lưu ý: Tài khoản chỉ sử dụng tối đa <strong>01 thiết bị</strong>.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALblbqW_VrZh2r7sPJ8Q6XT2fGbk0dsFg",
            authDomain: "donghung-3208d.firebaseapp.com",
            projectId: "donghung-3208d",
            storageBucket: "donghung-3208d.firebasestorage.app",
            messagingSenderId: "753379492663",
            appId: "1:753379492663:web:baff34f2c0bac00e02d0b2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const msg = document.getElementById("message");
        const registerBtn = document.getElementById("registerBtn");

        function getDeviceId() {
            let id = localStorage.getItem('my_device_id');
            if (!id) {
                id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                localStorage.setItem('my_device_id', id);
            }
            return id;
        }

        // --- CHỨC NĂNG ĐĂNG KÝ ---
        registerBtn.addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const fullName = document.getElementById("name").value.trim();

            if (!email || !password || !fullName) {
                msg.textContent = "❌ Vui lòng nhập đầy đủ Họ tên, Email và Mật khẩu để đăng ký.";
                msg.style.color = "red";
                return;
            }

            msg.textContent = "⏳ Đang tạo tài khoản...";
            msg.style.color = "#1e40af";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const currentDeviceId = getDeviceId();

                // Tạo hồ sơ user trên Firestore
                await setDoc(doc(db, "users", user.uid), {
                    name: fullName,
                    email: email,
                    device_count: 1,
                    isPremium: false, // Mặc định là Free
                    role: "user",
                    status: "active",
                    devices: {
                        [currentDeviceId]: {
                            name: navigator.platform,
                            addedAt: serverTimestamp(),
                            last_login: serverTimestamp()
                        }
                    },
                    createdAt: serverTimestamp()
                });

                msg.textContent = "✅ Đăng ký thành công! Đang vào hệ thống...";
                msg.style.color = "green";
                setTimeout(() => location.href = "index.html", 1500);

            } catch (err) {
                msg.style.color = "red";
                if (err.code === 'auth/email-already-in-use') msg.textContent = "❌ Email này đã được đăng ký.";
                else msg.textContent = "❌ Lỗi: " + err.message;
            }
        });

        // --- CHỨC NĂNG ĐĂNG NHẬP (Giữ nguyên logic cũ của bạn) ---
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const currentDeviceId = getDeviceId();

            msg.textContent = "⏳ Đang đăng nhập...";
            msg.style.color = "#1e40af";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    
                    // Kiểm tra khóa
                    if (userData.status === 'banned') {
                        await signOut(auth);
                        throw new Error("Tài khoản đã bị khóa.");
                    }

                    // Kiểm tra thiết bị (Bỏ qua nếu là admin)
                    const isAdmin = userData.role === 'admin';
                    const devices = userData.devices || {};
                    if (!isAdmin && userData.device_count >= 1 && !devices[currentDeviceId]) {
                        await signOut(auth);
                        throw new Error("Chỉ được dùng trên 1 thiết bị. Liên hệ Admin để reset.");
                    }

                    // Cập nhật last login
                    await updateDoc(userDocRef, {
                        [`devices.${currentDeviceId}.last_login`]: serverTimestamp()
                    });
                }

                msg.textContent = "✅ Thành công!";
                msg.style.color = "green";
                setTimeout(() => location.href = "index.html", 500);
            } catch (err) {
                msg.textContent = "❌ " + err.message;
                msg.style.color = "red";
            }
        });
    </script>
</body>
</html>
