<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Prometric Mock Exam Pro</title>
    <style>
        :root {
            --pro-green: #7fb069;
            --pro-dark: #333;
            --pro-border: #ccc;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            display: flex; flex-direction: column; height: 100vh; 
            overflow: hidden; background: #fff;
        }

        /* Header cố định */
        .pro-header { 
            background: var(--pro-dark); color: white; padding: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 1001; position: sticky; top: 0;
        }
        .status-bar { background: var(--pro-green); color: white; padding: 6px 12px; font-size: 12px; display: flex; justify-content: space-between; }

        .pro-main { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            position: relative; 
        }

       /* SIDEBAR: Chỉ thêm các dòng ép cuộn */
.pro-sidebar { 
    width: 48px; 
    background: #f8f8f8; 
    border-right: 1px solid var(--pro-border); 
    
    /* FIX LỖI TẠI ĐÂY */
    display: block !important; /* Đổi từ flex sang block để thanh cuộn hoạt động */
    overflow-y: auto !important; /* Hiện thanh cuộn khi quá 40 câu */
    -webkit-overflow-scrolling: touch; /* Lướt mượt trên iPhone */
    
    padding: 10px 4px;
    padding-bottom: 120px !important; /* Tạo khoảng trống để không bị Footer che câu 40 */
}

        /* CSS cho PC */
        @media (min-width: 769px) {
            .pro-sidebar { width: 220px; padding-bottom: 20px !important; }
            #q-grid { display: flex; flex-wrap: wrap; gap: 5px; }
            .q-num { width: 45px; height: 45px; font-size: 14px; margin-bottom: 0; }
        }

      /* CSS cho Điện thoại */
@media (max-width: 768px) {
    .pro-sidebar { 
        width: 50px; 
        /* Xóa flex-direction và flex-wrap ở đây để display: block bên trên có tác dụng */
    }
    .pro-main { margin-bottom: 75px; } 
    .q-num { 
        margin: 0 auto 10px auto; /* Giữ các nút số nằm giữa và cách nhau */
        display: flex; /* Đảm bảo con số vẫn nằm giữa nút */
    } 
}
        .q-num { 
            width: 38px; 
            height: 38px; 
            border: 1px solid #999; 
            background: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            border-radius: 4px;
            font-size: 12px;
            flex-shrink: 0;
        }
        .q-num.active { border: 2px solid var(--pro-green); background: #ffffd0; font-weight: bold; }
        .q-num.done { background: var(--pro-green); color: white; border-color: var(--pro-green); }
        .q-num.flagged { background: #facc15 !important; border-color: #eab308 !important; color: black; }

        /* NỘI DUNG CÂU HỎI */
        .pro-content { flex: 1; padding: 15px; overflow-y: auto; padding-bottom: 180px !important; }
        .q-text { 
            background: #f5f5f5; padding: 15px; border-radius: 6px; border-left: 5px solid var(--pro-green);
            font-size: 18px; line-height: 1.6; margin-bottom: 20px;
        }
        .pro-opt { border: 1px solid var(--pro-border); padding: 15px; margin: 10px 0; cursor: pointer; border-radius: 8px; background: #fff; }
        .pro-opt.selected { background: #e9f5e6; border-color: var(--pro-green); font-weight: bold; }

        /* FOOTER */
        .pro-footer { 
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #444; color: white; padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }
        .footer-left { display: flex; gap: 10px; }
        .footer-right { display: flex; gap: 8px; }

        .btn-icon { background: none; border: 1px solid #777; color: white; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; }
        .btn-jp { background: var(--pro-green); color: white; border: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; font-size: 14px; min-width: 80px; }

        /* MÀN HÌNH KẾT QUẢ */
        #result-screen { display: none; position: fixed; inset: 0; background: #fff; z-index: 2000; overflow-y: auto; }
        .result-header { 
            position: sticky; top: 0; background: var(--pro-dark); padding: 10px; 
            display: flex; justify-content: space-between; z-index: 2001; 
        }

        ruby rt { font-size: 10px; color: #555; }
    </style>
</head>
<body>

<div id="exam-ui">
    <header class="pro-header">
        <div style="font-size:12px;">特定技能試験</div>
        <div id="pro-timer" style="font-size:22px; font-weight:bold; color:#ffdd00;">60:00</div>
        <button onclick="submitExam()" style="background:#cc0000; color:white; border:none; padding:6px 15px; border-radius:4px; font-weight:bold;">終了</button>
    </header>

    <div class="status-bar">
        <div id="q-title">質問: 1 / 40</div>
        <div id="user-name">受験者名: Thi thử</div>
    </div>

    <div class="pro-main">
        <aside class="pro-sidebar" id="q-grid"></aside>
        <main class="pro-content" id="scroll-area">
            <div id="pro-quiz" style="max-width:800px; margin:0 auto;"></div>
        </main>
    </div>

    <footer class="pro-footer">
        <div class="footer-left">
            <button class="btn-icon" onclick="alert('HD: 🚩 Đánh dấu, 戻る Quay lại, 次へ Tiếp theo')">?</button>
            <button class="btn-icon" onclick="toggleFlag()">🚩</button>
        </div>
        <div class="footer-right">
            <button class="btn-jp" style="background:#666" id="btn-prev" onclick="prevQ()">戻る</button>
            <button class="btn-jp" id="btn-next" onclick="nextQ()">次へ</button>
        </div>
    </footer>
</div>

<div id="result-screen">
    <div class="result-header">
        <button onclick="location.href='index.html'" style="background:#555; color:white; border:none; padding:8px 15px; border-radius:4px;">🏠 Trang chủ</button>
        <div style="color:white; font-weight:bold; padding-top:8px;">KẾT QUẢ</div>
        <button onclick="location.reload()" style="background:var(--pro-green); color:white; border:none; padding:8px 15px; border-radius:4px;">🔄 Làm lại</button>
    </div>
    <div style="padding: 20px;">
        <div id="score-percent" style="text-align:center; font-size:50px; color:red; font-weight:bold; margin:20px 0;">0%</div>
        <div id="score-detail" style="text-align:center; font-size:18px; margin-bottom:30px;"></div>
        <div id="wrong-questions"></div>
    </div>
</div>

<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="questions3.js"></script>
<script src="questions4.js"></script>
<script src="questions5.js"></script>
<script src="questions6.js"></script>
<script src="questions7.js"></script>
<script src="questions8.js"></script>

<script>
    let currentQuestions = [];
    let currentIdx = 0;
    let answers = [];
    let flags = [];
    let timeLeft = 3600;

    function loadData() {
        const qSets = window.QUESTION_SETS || {};
        const ids = ['1','2','3','4','5','6','7','8'];
        ids.forEach(id => { if(qSets[id]) currentQuestions = currentQuestions.concat(qSets[id]); });
        currentQuestions = currentQuestions.sort(() => Math.random() - 0.5).slice(0, 40);
        return currentQuestions.length > 0;
    }

    function convertFurigana(text) {
        if (!text) return "";
        return text.replace(/([一-龯々〆ヶ]+)\s*[（(]([^）)]+)[）)]/g, 
            (m, kanji, kana) => `<ruby>${kanji}<rt>${kana}</rt></ruby>`);
    }

    function renderExam() {
        const q = currentQuestions[currentIdx];
        document.getElementById('q-title').innerText = `質問: ${currentIdx + 1} / ${currentQuestions.length}`;
        
        document.getElementById('pro-quiz').innerHTML = `
            <div class="q-text"><b>問題 ${currentIdx + 1}:</b><br>${convertFurigana(q.q)}</div>
            ${q.img ? `<img src="${q.img}" style="width:100%; border-radius:5px; margin-bottom:15px; max-height:250px; object-fit:contain;">` : ''}
            <div>
                ${q.options.map((opt, i) => `
                    <div class="pro-opt ${answers[currentIdx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
                        ${convertFurigana(opt)}
                    </div>
                `).join('')}
            </div>
        `;

        // Render danh sách câu hỏi
        document.getElementById('q-grid').innerHTML = currentQuestions.map((_, i) => `
            <div class="q-num ${currentIdx === i ? 'active' : ''} ${answers[i] !== null ? 'done' : ''} ${flags[i] ? 'flagged' : ''}" 
                 onclick="goTo(${i})">${i + 1}</div>
        `).join('');

        document.getElementById('btn-prev').disabled = currentIdx === 0;
        document.getElementById('btn-next').innerText = currentIdx === currentQuestions.length - 1 ? "終了" : "次へ";
        document.getElementById('scroll-area').scrollTop = 0;
    }

    window.selectOpt = (i) => { answers[currentIdx] = i; renderExam(); };
    window.goTo = (i) => { currentIdx = i; renderExam(); };
    window.nextQ = () => {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; renderExam(); }
        else { submitExam(); }
    };
    window.prevQ = () => { if (currentIdx > 0) { currentIdx--; renderExam(); } };
    window.toggleFlag = () => { flags[currentIdx] = !flags[currentIdx]; renderExam(); };

    function startTimer() {
        const timer = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('pro-timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(timeLeft <= 0) { clearInterval(timer); submitExam(); }
        }, 1000);
    }

    window.submitExam = () => {
        if(!confirm("終了しますか？")) return;
        document.getElementById('exam-ui').style.display = "none";
        document.getElementById('result-screen').style.display = "block";
        
        let correct = 0;
        let html = "";
        currentQuestions.forEach((q, i) => {
            if(answers[i] === q.answer) correct++;
            else {
                html += `<div style="padding:15px 0; border-bottom:1px solid #eee;">
                    <p><b>Câu ${i+1}:</b> ${convertFurigana(q.q)}</p>
                    <p style="color:red">Bạn chọn: ${answers[i] !== null ? convertFurigana(q.options[answers[i]]) : 'Chưa chọn'}</p>
                    <p style="color:green">Đáp án: ${convertFurigana(q.options[q.answer])}</p>
                </div>`;
            }
        });
        document.getElementById('score-percent').innerText = Math.round(correct/currentQuestions.length*100) + "%";
        document.getElementById('score-detail').innerText = `正解: ${correct} / ${currentQuestions.length}`;
        document.getElementById('wrong-questions').innerHTML = html;
        window.scrollTo(0,0);
    };

    if (loadData()) {
        answers = new Array(currentQuestions.length).fill(null);
        flags = new Array(currentQuestions.length).fill(false);
        startTimer();
        renderExam();
    }
</script>
</body>
</html>
