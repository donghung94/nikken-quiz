<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Prometric Mobile Optimized</title>
    <style>
        :root {
            --pro-green: #7fb069;
            --pro-dark: #333;
            --pro-border: #ccc;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* Header & Status */
        .pro-header { background: var(--pro-dark); color: white; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .status-bar { background: var(--pro-green); color: white; padding: 4px 12px; font-size: 12px; display: flex; justify-content: space-between; }

        /* Bố cục chính: Sidebar Trái + Nội dung Phải */
        .pro-main { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR NÚT NHỎ DỌC BÊN TRÁI */
        .pro-sidebar { 
            width: 45px; /* Rất nhỏ để không chiếm chỗ */
            background: #eee; 
            border-right: 1px solid var(--pro-border); 
            overflow-y: auto; 
            padding: 5px 2px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .q-num { 
            width: 32px; height: 32px; /* Kích thước nút nhỏ */
            border: 1px solid #999; background: #fff; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 11px; border-radius: 2px; flex-shrink: 0;
        }
        .q-num.active { border: 2px solid var(--pro-green); font-weight: bold; background: #ffffd0; }
        .q-num.done { background: var(--pro-green); color: white; border-color: var(--pro-green); }

        /* NỘI DUNG CÂU HỎI BÊN PHẢI */
        .pro-content { 
            flex: 1; padding: 12px; overflow-y: auto; background: white;
        }
        .q-text { 
            background: #f5f5f5; padding: 12px; border-radius: 4px;
            font-size: 16px; line-height: 1.5; margin-bottom: 15px; border-left: 4px solid var(--pro-green);
        }

        /* Đáp án thẻ to dễ bấm */
        .pro-opt { 
            border: 1px solid var(--pro-border); padding: 12px; margin: 8px 0; 
            cursor: pointer; border-radius: 6px; font-size: 15px; background: #fff;
        }
        .pro-opt.selected { background: #e9f5e6; border-color: var(--pro-green); font-weight: bold; }

        /* Footer */
        .pro-footer { background: var(--pro-dark); padding: 8px; display: flex; justify-content: space-between; }
        .btn-footer { background: var(--pro-green); color: white; border: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; font-size: 13px; }

        ruby rt { font-size: 9px; color: #444; }
        #result-screen { display: none; position: fixed; inset: 0; background: #fff; z-index: 100; padding: 15px; overflow-y: auto; }
    </style>
</head>
<body>

<header class="pro-header">
    <a href="index.html" style="text-decoration:none; color:white; font-size:12px; background:#555; padding:4px 8px; border-radius:3px;">🏠 Home</a>
    <div id="pro-timer" style="font-size:18px; font-weight:bold;">60:00</div>
    <button onclick="submitExam()" style="background:#cc0000; color:white; border:none; padding:5px 10px; border-radius:3px; font-weight:bold; font-size:12px;">Nộp bài</button>
</header>

<div class="status-bar">
    <div id="q-title">Q: 1 / 40</div>
    <div>受験者名: Candidate</div>
</div>

<div class="pro-main">
    <aside class="pro-sidebar" id="q-grid"></aside>

    <main class="pro-content" id="scroll-area">
        <div id="pro-quiz" style="width:100%;"></div>
    </main>
</div>

<footer class="pro-footer">
    <button class="btn-footer" onclick="prevQ()">Quay lại</button>
    <button class="btn-footer" onclick="nextQ()">Tiếp theo</button>
</footer>

<div id="result-screen">
    <h2 style="text-align:center; color:var(--pro-green)">KẾT QUẢ</h2>
    <div id="score-percent" style="text-align:center; font-size:48px; color:red; font-weight:bold;">0%</div>
    <div id="score-detail" style="text-align:center; margin:15px 0;"></div>
    <div id="wrong-questions"></div>
    <button onclick="location.reload()" style="width:100%; padding:15px; background:var(--pro-green); color:white; border:none; border-radius:5px;">Làm lại</button>
</div>

<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="questions3.js"></script>
<script src="questions4.js"></script>
<script src="questions5.js"></script>
<script src="questions6.js"></script>
<script src="questions7.js"></script>
<script src="questions8.js"></script>

<script>
    let currentQuestions = [];
    let currentIdx = 0;
    let answers = [];
    let timeLeft = 3600;

    function loadData() {
        const qSets = window.QUESTION_SETS || {};
        const ids = ['1','2','3','4','5','6','7','8'];
        ids.forEach(id => { if(qSets[id]) currentQuestions = currentQuestions.concat(qSets[id]); });
        // Lấy đúng 40 câu
        currentQuestions = currentQuestions.sort(() => Math.random() - 0.5).slice(0, 40);
        return currentQuestions.length > 0;
    }

    function convertFurigana(text) {
        if (!text) return "";
        return text.replace(/([一-龯々〆ヶ]+)\s*[（(]([^）)]+)[）)]/g, 
            (m, kanji, kana) => `<ruby>${kanji}<rt>${kana}</rt></ruby>`);
    }

    function renderExam() {
        const q = currentQuestions[currentIdx];
        document.getElementById('q-title').innerText = `Q: ${currentIdx + 1} / ${currentQuestions.length}`;
        
        // Render nội dung
        document.getElementById('pro-quiz').innerHTML = `
            <div class="q-text"><b>問題 ${currentIdx + 1}:</b><br>${convertFurigana(q.q)}</div>
            ${q.img ? `<img src="${q.img}" style="width:100%; border-radius:4px; margin-bottom:10px; max-height:180px; object-fit:contain;">` : ''}
            <div>
                ${q.options.map((opt, i) => `
                    <div class="pro-opt ${answers[currentIdx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
                        ${convertFurigana(opt)}
                    </div>
                `).join('')}
            </div>
        `;

        // Render dải nút số dọc bên trái
        document.getElementById('q-grid').innerHTML = currentQuestions.map((_, i) => `
            <div class="q-num ${currentIdx === i ? 'active' : ''} ${answers[i] !== null ? 'done' : ''}" 
                 onclick="goTo(${i})">${i + 1}</div>
        `).join('');

        // Cuộn nội dung về đầu câu mới
        document.getElementById('scroll-area').scrollTop = 0;
    }

    window.selectOpt = (i) => { answers[currentIdx] = i; renderExam(); };
    window.goTo = (i) => { currentIdx = i; renderExam(); };
    window.nextQ = () => {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; renderExam(); }
        else { submitExam(); }
    };
    window.prevQ = () => { if (currentIdx > 0) { currentIdx--; renderExam(); } };

    function startTimer() {
        setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('pro-timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    window.submitExam = () => {
        if(!confirm("Bạn muốn nộp bài?")) return;
        let correct = 0;
        let html = "";
        currentQuestions.forEach((q, i) => {
            if(answers[i] === q.answer) correct++;
            else {
                html += `<div style="padding:10px 0; border-bottom:1px solid #eee; font-size:14px;">
                    <p><b>Câu ${i+1}:</b> ${convertFurigana(q.q)}</p>
                    <p style="color:red">Chọn: ${answers[i] !== null ? convertFurigana(q.options[answers[i]]) : 'Bỏ'}</p>
                    <p style="color:green">Đáp án: ${convertFurigana(q.options[q.answer])}</p>
                </div>`;
            }
        });
        document.getElementById('result-screen').style.display = "block";
        document.getElementById('score-percent').innerText = Math.round(correct/currentQuestions.length*100) + "%";
        document.getElementById('score-detail').innerText = `Kết quả: ${correct} / ${currentQuestions.length}`;
        document.getElementById('wrong-questions').innerHTML = html;
    };

    if (loadData()) {
        answers = new Array(currentQuestions.length).fill(null);
        startTimer();
        renderExam();
    }
</script>
</body>
</html>
