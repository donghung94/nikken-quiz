<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Prometric Mock Test</title>
    <style>
        :root {
            --pro-green: #7fb069;
            --pro-light-green: #e9f5e6;
            --pro-dark: #333333;
            --pro-border: #cccccc;
        }

        body { 
            background-color: #f4f4f4; 
            font-family: sans-serif; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        /* Header chuyên nghiệp */
        .pro-header { 
            background: var(--pro-dark); color: white; padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px;
        }
        .timer-box { color: #fff; font-size: 18px; font-weight: bold; }

        /* Thanh trạng thái xanh */
        .status-bar {
            background: var(--pro-green); color: white; padding: 5px 15px;
            font-size: 13px; display: flex; justify-content: space-between;
        }

        .pro-main { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar - Tối ưu cho Mobile */
        .pro-sidebar { 
            width: 200px; background: #ffffff; border-right: 1px solid var(--pro-border); 
            padding: 10px; overflow-y: auto; transition: 0.3s;
        }

        @media (max-width: 768px) {
            .pro-sidebar { 
                position: absolute; left: -200px; z-index: 10; height: 100%;
                box-shadow: 2px 0 5px rgba(0,0,0,0.2);
            }
            .pro-sidebar.open { left: 0; }
        }

        .q-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .q-num { 
            aspect-ratio: 1; border: 1px solid var(--pro-border); background: #f9f9f9; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 12px; border-radius: 3px;
        }
        .q-num.active { background: #fff; border: 2px solid var(--pro-green); font-weight: bold; }
        .q-num.done { background: var(--pro-green); color: white; }
        .q-num.flagged { background: #facc15 !important; color: black; }

        /* Vùng nội dung câu hỏi */
        .pro-content { 
            flex: 1; padding: 20px; overflow-y: auto; background: white;
            display: flex; flex-direction: column; align-items: center;
        }
        .question-box { width: 100%; max-width: 700px; }
        .q-text { 
            background: #eeeeee; padding: 15px; border-radius: 5px;
            font-size: 18px; line-height: 1.6; margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        /* Option kiểu Prometric trong ảnh */
        .pro-opt { 
            border: 1px solid var(--pro-border); padding: 15px; margin: 10px 0; 
            cursor: pointer; border-radius: 5px; font-size: 16px;
            transition: 0.2s; background: #fff;
        }
        .pro-opt.selected { background: var(--pro-light-green); border-color: var(--pro-green); font-weight: bold; }

        /* Footer nút bấm */
        .pro-footer { 
            background: var(--pro-dark); padding: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-footer { 
            background: #7fb069; color: white; border: none; 
            padding: 8px 20px; border-radius: 20px; cursor: pointer;
            font-size: 14px; display: flex; align-items: center; gap: 5px;
        }
        .btn-footer:disabled { background: #666; opacity: 0.5; }

        /* Màn hình kết quả */
        #result-screen {
            display: none; position: fixed; inset: 0; background: #fff; 
            z-index: 100; overflow-y: auto; padding: 20px;
        }
        .result-card { max-width: 600px; margin: 0 auto; }
        .wrong-item { border-bottom: 1px solid #eee; padding: 15px 0; }

        ruby rt { font-size: 10px; color: #444; }
    </style>
</head>
<body>

<header class="pro-header">
    <div onclick="toggleSidebar()" style="cursor:pointer">☰ Menu</div>
    <div id="pro-timer" class="timer-box">60:00</div>
    <button onclick="submitExam()" style="background:#cc0000; color:white; border:none; padding:5px 10px; border-radius:4px;">Nộp bài</button>
</header>

<div class="status-bar">
    <div id="q-title">質問: 1</div>
    <div>受験者名: Thi thử</div>
</div>

<div class="pro-main">
    <aside class="pro-sidebar" id="sidebar">
        <div class="q-grid" id="q-grid"></div>
        <div style="margin-top:20px; font-size:11px;">
            <p><span style="background:#7fb069; padding:2px 8px; color:white">■</span> Đã làm</p>
            <p><span style="background:#facc15; padding:2px 8px;">■</span> Đánh dấu</p>
        </div>
    </aside>

    <main class="pro-content">
        <div id="pro-quiz" class="question-box"></div>
    </main>
</div>

<footer class="pro-footer">
    <button id="btn-flag" class="btn-footer" style="background:#555">🚩 Đánh dấu</button>
    <div style="display:flex; gap:10px">
        <button id="btn-prev" class="btn-footer"> Quay lại </button>
        <button id="btn-next" class="btn-footer"> Tiếp theo </button>
    </div>
</footer>

<div id="result-screen">
    <div class="result-card">
        <h2 style="text-align:center; color:var(--pro-green)">KẾT QUẢ BÀI THI</h2>
        <div id="score-percent" style="text-align:center; font-size:48px; font-weight:bold; color:red;">0%</div>
        <div id="score-detail" style="text-align:center; margin-bottom:20px;"></div>
        <div id="wrong-questions"></div>
        <button onclick="location.reload()" style="width:100%; padding:15px; background:var(--pro-green); color:white; border:none; border-radius:5px; margin-top:20px;">Làm đề khác</button>
    </div>
</div>

<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="questions3.js"></script>
<script src="questions4.js"></script>
<script src="questions5.js"></script>
<script src="questions6.js"></script>
<script src="questions7.js"></script>
<script src="questions8.js"></script>

<script>
    const params = new URLSearchParams(location.search);
    const setId = params.get('set') || 'randomExam';
    
    let currentQuestions = [];
    let currentIdx = 0;
    let answers = [];
    let flags = [];
    let timeLeft = 3600;

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function loadData() {
        const qSets = window.QUESTION_SETS || {};
        if (setId === 'randomExam') {
            const theoryIds = ['1','2','3','4','5','6','7','8'];
            theoryIds.forEach(id => { if(qSets[id]) currentQuestions = currentQuestions.concat(qSets[id]); });
            currentQuestions = currentQuestions.sort(() => Math.random() - 0.5).slice(0, 30);
        } else if (qSets[setId]) {
            currentQuestions = [...qSets[setId]];
        }
        return currentQuestions.length > 0;
    }

    function convertFurigana(text) {
        if (!text) return "";
        return text.replace(/([一-龯々〆ヶ]+)\s*[（(]([^）)]+)[）)]/g, 
            (m, kanji, kana) => `<ruby>${kanji}<rt>${kana}</rt></ruby>`);
    }

    function renderExam() {
        const q = currentQuestions[currentIdx];
        document.getElementById('q-title').innerText = `質問: ${currentIdx + 1}`;
        
        document.getElementById('pro-quiz').innerHTML = `
            <div class="q-text">問題${currentIdx + 1}: ${convertFurigana(q.q)}</div>
            ${q.img ? `<img src="${q.img}" style="width:100%; border-radius:5px; margin-bottom:15px;">` : ''}
            <div>
                ${q.options.map((opt, i) => `
                    <div class="pro-opt ${answers[currentIdx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
                        ${convertFurigana(opt)}
                    </div>
                `).join('')}
            </div>
        `;

        document.getElementById('q-grid').innerHTML = currentQuestions.map((_, i) => `
            <div class="q-num ${currentIdx === i ? 'active' : ''} ${answers[i] !== null ? 'done' : ''} ${flags[i] ? 'flagged' : ''}" 
                 onclick="goTo(${i})">${i + 1}</div>
        `).join('');

        document.getElementById('btn-prev').disabled = currentIdx === 0;
        document.getElementById('sidebar').classList.remove('open');
    }

    window.selectOpt = (i) => { answers[currentIdx] = i; renderExam(); };
    window.goTo = (i) => { currentIdx = i; renderExam(); };
    
    document.getElementById('btn-next').onclick = () => {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; renderExam(); }
    };
    document.getElementById('btn-prev').onclick = () => {
        if (currentIdx > 0) { currentIdx--; renderExam(); }
    };
    document.getElementById('btn-flag').onclick = () => {
        flags[currentIdx] = !flags[currentIdx]; renderExam();
    };

    function startTimer() {
        setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('pro-timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    window.submitExam = () => {
        if(!confirm("Bạn có chắc chắn muốn nộp bài?")) return;
        let correct = 0;
        let html = "";
        currentQuestions.forEach((q, i) => {
            if(answers[i] === q.answer) correct++;
            else {
                html += `<div class="wrong-item">
                    <p><b>Câu ${i+1}:</b> ${convertFurigana(q.q)}</p>
                    <p style="color:red">Sai: ${answers[i] !== null ? convertFurigana(q.options[answers[i]]) : 'Bỏ trống'}</p>
                    <p style="color:green">Đúng: ${convertFurigana(q.options[q.answer])}</p>
                </div>`;
            }
        });
        document.getElementById('result-screen').style.display = "block";
        document.getElementById('score-percent').innerText = Math.round(correct/currentQuestions.length*100) + "%";
        document.getElementById('score-detail').innerText = `Đúng ${correct}/${currentQuestions.length} câu`;
        document.getElementById('wrong-questions').innerHTML = html;
    };

    if (loadData()) {
        answers = new Array(currentQuestions.length).fill(null);
        flags = new Array(currentQuestions.length).fill(false);
        startTimer();
        renderExam();
    }
</script>
</body>
</html>
