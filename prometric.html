<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Prometric Mock Test</title>
    <style>
        :root {
            --pro-green: #7fb069;
            --pro-light-green: #e9f5e6;
            --pro-dark: #333333;
            --pro-border: #cccccc;
        }

        /* Reset bố cục để không bị tràn */
        * { box-sizing: border-box; }
        body { 
            background-color: #f4f4f4; 
            font-family: sans-serif; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        /* Header chuẩn: Nút Home - Timer - Nộp bài */
        .pro-header { 
            background: var(--pro-dark); color: white; padding: 10px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-home {
            background: #555; color: white; text-decoration: none;
            padding: 6px 12px; border-radius: 4px; font-size: 13px;
        }
        .timer-box { font-size: 18px; font-weight: bold; color: #fff; }

        /* Thanh trạng thái xanh: Tên câu hỏi - Tên thí sinh */
        .status-bar {
            background: var(--pro-green); color: white; padding: 6px 15px;
            font-size: 13px; display: flex; justify-content: space-between;
        }

        .pro-main { display: flex; flex: 1; overflow: hidden; width: 100%; }

        /* Sidebar: Chỉ hiện trên Desktop, ẩn hoàn toàn trên Mobile */
        .pro-sidebar { 
            width: 200px; background: #ffffff; border-right: 1px solid var(--pro-border); 
            padding: 10px; overflow-y: auto;
        }
        @media (max-width: 768px) {
            .pro-sidebar { display: none !important; } 
        }

        /* Nội dung chính: Căn giữa 100% trên điện thoại */
        .pro-content { 
            flex: 1; padding: 15px; overflow-y: auto; background: white;
            display: flex; flex-direction: column; align-items: center;
        }
        .question-box { width: 100%; max-width: 600px; }
        
        /* Khung câu hỏi màu xám */
        .q-text { 
            background: #f0f0f0; padding: 15px; border-radius: 5px;
            font-size: 17px; line-height: 1.6; margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        /* Đáp án dạng thẻ giống ảnh mẫu */
        .pro-opt { 
            border: 1px solid var(--pro-border); padding: 15px; margin: 10px 0; 
            cursor: pointer; border-radius: 5px; font-size: 16px;
            background: #fff; transition: 0.2s;
        }
        .pro-opt.selected { 
            background: var(--pro-light-green); 
            border-color: var(--pro-green); 
            font-weight: bold; 
        }

        /* Footer cố định phía dưới */
        .pro-footer { 
            background: var(--pro-dark); padding: 12px;
            display: flex; justify-content: space-between;
        }
        .btn-footer { 
            background: var(--pro-green); color: white; border: none; 
            padding: 10px 25px; border-radius: 20px; cursor: pointer;
            font-size: 14px; font-weight: bold;
        }
        .btn-footer:disabled { opacity: 0.3; }

        ruby rt { font-size: 10px; color: #666; }
        
        /* Màn hình kết quả */
        #result-screen {
            display: none; position: fixed; inset: 0; background: #fff; 
            z-index: 1000; overflow-y: auto; padding: 20px;
        }
    </style>
</head>
<body>

<header class="pro-header">
    <a href="index.html" class="btn-home">🏠 Trang chủ</a>
    <div id="pro-timer" class="timer-box">60:00</div>
    <button onclick="submitExam()" style="background:#cc0000; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold;">Nộp bài</button>
</header>

<div class="status-bar">
    <div id="q-title">質問: 1</div>
    <div>受験者名: Thi thử</div>
</div>

<div class="pro-main">
    <aside class="pro-sidebar" id="sidebar">
        <div id="q-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;"></div>
    </aside>

    <main class="pro-content">
        <div id="pro-quiz" class="question-box"></div>
    </main>
</div>

<footer class="pro-footer">
    <button id="btn-prev" class="btn-footer"> Quay lại </button>
    <button id="btn-next" class="btn-footer"> Tiếp theo </button>
</footer>

<div id="result-screen">
    <div style="max-width: 600px; margin: 0 auto; text-align: center;">
        <h2 style="color:var(--pro-green)">KẾT QUẢ BÀI THI</h2>
        <div id="score-percent" style="font-size:60px; font-weight:bold; color:red;">0%</div>
        <div id="score-detail" style="margin: 20px 0;"></div>
        <div id="wrong-questions" style="text-align: left;"></div>
        <button onclick="location.reload()" style="width:100%; padding:15px; background:var(--pro-green); color:white; border:none; border-radius:5px; font-weight:bold;">THI LẠI</button>
        <button onclick="location.href='index.html'" style="width:100%; padding:15px; background:#666; color:white; border:none; border-radius:5px; margin-top:10px;">VỀ TRANG CHỦ</button>
    </div>
</div>

<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="questions3.js"></script>
<script src="questions4.js"></script>
<script src="questions5.js"></script>
<script src="questions6.js"></script>
<script src="questions7.js"></script>
<script src="questions8.js"></script>

<script>
    const params = new URLSearchParams(location.search);
    const setId = params.get('set') || 'randomExam';
    let currentQuestions = [];
    let currentIdx = 0;
    let answers = [];
    let timeLeft = 3600;

    function loadData() {
        const qSets = window.QUESTION_SETS || {};
        if (setId === 'randomExam') {
            const ids = ['1','2','3','4','5','6','7','8'];
            ids.forEach(id => { if(qSets[id]) currentQuestions = currentQuestions.concat(qSets[id]); });
            // Cài đặt lấy 40 câu ngẫu nhiên
            currentQuestions = currentQuestions.sort(() => Math.random() - 0.5).slice(0, 40);
        } else if (qSets[setId]) {
            currentQuestions = [...qSets[setId]];
        }
        return currentQuestions.length > 0;
    }

    function convertFurigana(text) {
        if (!text) return "";
        return text.replace(/([一-龯々〆ヶ]+)\s*[（(]([^）)]+)[）)]/g, 
            (m, kanji, kana) => `<ruby>${kanji}<rt>${kana}</rt></ruby>`);
    }

    function renderExam() {
        const q = currentQuestions[currentIdx];
        document.getElementById('q-title').innerText = `質問: ${currentIdx + 1} / ${currentQuestions.length}`;
        
        document.getElementById('pro-quiz').innerHTML = `
            <div class="q-text">問題${currentIdx + 1}: <br>${convertFurigana(q.q)}</div>
            ${q.img ? `<img src="${q.img}" style="width:100%; max-height:200px; object-fit:contain; margin-bottom:15px;">` : ''}
            <div>
                ${q.options.map((opt, i) => `
                    <div class="pro-opt ${answers[currentIdx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
                        ${convertFurigana(opt)}
                    </div>
                `).join('')}
            </div>
        `;

        const grid = document.getElementById('q-grid');
        if (grid) {
            grid.innerHTML = currentQuestions.map((_, i) => `
                <div style="padding:10px; border:1px solid #ccc; text-align:center; cursor:pointer; background:${answers[i]!==null?'#7fb069':(currentIdx===i?'#fff':'#f9f9f9')}; color:${answers[i]!==null?'white':'black'}" 
                     onclick="goTo(${i})">${i + 1}</div>
            `).join('');
        }

        document.getElementById('btn-prev').disabled = currentIdx === 0;
        document.getElementById('btn-next').innerText = currentIdx === currentQuestions.length - 1 ? "Nộp bài" : "Tiếp theo";
    }

    window.selectOpt = (i) => { answers[currentIdx] = i; renderExam(); };
    window.goTo = (i) => { currentIdx = i; renderExam(); };
    
    document.getElementById('btn-next').onclick = () => {
        if (currentIdx < currentQuestions.length - 1) { currentIdx++; renderExam(); }
        else { submitExam(); }
    };
    document.getElementById('btn-prev').onclick = () => {
        if (currentIdx > 0) { currentIdx--; renderExam(); }
    };

    function startTimer() {
        setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('pro-timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    window.submitExam = () => {
        if(!confirm("Bạn muốn nộp bài?")) return;
        let correct = 0;
        let html = "";
        currentQuestions.forEach((q, i) => {
            if(answers[i] === q.answer) correct++;
            else {
                html += `<div style="padding:10px 0; border-bottom:1px solid #eee;">
                    <p><b>Câu ${i+1}:</b> ${convertFurigana(q.q)}</p>
                    <p style="color:red">Sai: ${answers[i] !== null ? convertFurigana(q.options[answers[i]]) : 'Bỏ trống'}</p>
                    <p style="color:green">Đúng: ${convertFurigana(q.options[q.answer])}</p>
                </div>`;
            }
        });
        document.getElementById('result-screen').style.display = "block";
        document.getElementById('score-percent').innerText = Math.round(correct/currentQuestions.length*100) + "%";
        document.getElementById('score-detail').innerText = `Đúng ${correct}/${currentQuestions.length} câu.`;
        document.getElementById('wrong-questions').innerHTML = html;
    };

    if (loadData()) {
        answers = new Array(currentQuestions.length).fill(null);
        startTimer();
        renderExam();
    }
</script>
</body>
</html>
